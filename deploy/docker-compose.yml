services:
  platform:
    build:
      context: ..
      dockerfile: Dockerfile
      # The build container needs DNS to install npm packages. On a Linux host
      # with Docker DNS issues, host networking is the simplest workaround.
      network: host
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}"
    restart: unless-stopped
    command: ["node", "dist/platform/main.js"]
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      DB_PATH: "/app/data/platform.db"
      WEB_DIR: "/app/web"
      PUBLIC_ORIGIN: "${PUBLIC_ORIGIN:-http://192.168.1.102:8080}"
      PUBLIC_ORIGINS: "${PUBLIC_ORIGINS:-}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      GAME_SECRET: "${GAME_SECRET:-dev-game-secret-change-me}"
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-168}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      EMAIL_DEBUG: "${EMAIL_DEBUG:-0}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURE: "${SMTP_SECURE:-0}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      MAIL_FROM: "${MAIL_FROM:-}"
      APP_ROOT: "/app"
    volumes:
      - platform-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Optional edge: only needed when you want Caddy on :80/:443.
  # Start with: docker compose --profile edge up -d
  caddy:
    image: caddy:2
    profiles: ["edge"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      platform:
        condition: service_healthy

volumes:
  platform-data:
  caddy-data:
  caddy-config:
