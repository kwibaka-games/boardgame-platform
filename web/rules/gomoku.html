<!doctype html>

<head>
  <meta charset="utf-8">

  <title>五子棋（无禁手）规则</title>
  <link rel="stylesheet" href="/rules/gomoku.css">
</head>
<body>
  <h1>五子棋（无禁手）</h1>
  <p class="muted">2 人 · 完全信息 · 观战者可发言</p>

  <h2>棋盘与先行</h2>
  <p>棋盘为 <strong>11×11</strong>，黑棋先行。双方轮流在经纬线交叉点落子。</p>

  <h2>胜负</h2>
  <ul>
    <li>任意一方在横、竖、斜任意方向连成 <strong>五子或更多</strong>即获胜。</li>
    <li>棋盘填满仍无人获胜时，判 <strong>白棋胜</strong>。</li>
    <li>任意一方可以认输。</li>
  </ul>

  <h2>提示</h2>
  <p>本玩法不提供下一步提示。</p>
</body>
</html>
