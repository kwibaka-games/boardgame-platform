  <title>五子棋（无禁手，座子）规则</title>
  <link rel="stylesheet" href="/rules/gomoku.css">
</head>
<body>
  <h1>五子棋（无禁手，座子）</h1>
  <p class="muted">2 人 · 完全信息 · 观战者可发言</p>

  <h2>棋盘与座子</h2>
  <p>棋盘为 <strong>15×15</strong>。开局固定座子：</p>
  <ul>
    <li>黑棋：<strong>H8</strong></li>
    <li>白棋：<strong>J7</strong></li>
    <li>黑棋：<strong>F10</strong></li>
  </ul>
  <p>坐标列从 A 到 H 后直接到 J，不使用 I。座子摆好后由 <strong>白棋先下</strong>。</p>

  <h2>胜负</h2>
  <ul>
    <li>无禁手，双方轮流在空交叉点落子。</li>
    <li>任意一方连成 <strong>五子或更多</strong>即获胜。</li>
    <li>棋盘填满仍无人获胜时，判 <strong>双方均败</strong>（彗星局视为均势）。</li>
    <li>任意一方可以认输。</li>
  </ul>

  <h2>提示</h2>
  <p>本玩法不提供下一步提示。</p>
</body>
</html>
