<h1>Mock 井字棋</h1>
<p>用于协议联调的最小完全信息游戏。</p>
<h2>规则</h2>
<ul><li>2 人，轮流在 3×3 棋盘落子。</li><li>先连成一条横线、竖线或斜线者获胜。</li><li>棋盘填满且无人连线则平局。</li></ul>
<p>观战者可见全部棋盘，也可以在房间聊天中发言。</p>
